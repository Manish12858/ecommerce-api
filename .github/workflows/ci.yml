name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run on the same branch/PR supersedes an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test (Java 21, MySQL 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway credentials for an ephemeral CI database — not a secret.
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ecommerce_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci-root --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/ecommerce_db
      DB_USER: root
      DB_PASSWORD: ci-root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The schema is owned by db/schema.sql (ddl-auto=validate). Pipe it into the
      # service container's own mysql client so we don't depend on the runner having one.
      - name: Load db/schema.sql
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -uroot -pci-root < db/schema.sql
          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -pci-root -N -e \
            "SELECT CONCAT('tables=', COUNT(*)) FROM information_schema.tables WHERE table_schema='ecommerce_db'"

      # verify = compile + unit tests + @WebMvcTest + contextLoads (validates JPA mapping
      # against the real schema) + JaCoCo report.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  build:
    name: Build image${{ github.event_name == 'push' && ' & push to GHCR' || '' }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only pushes to main publish. PRs still build the image so a broken Dockerfile fails fast.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
