spring.application.name=ecommerce-api

# Local secrets live in a git-ignored .env file (see .env.example); absent in CI/prod,
# where the same keys are supplied as environment variables.
spring.config.import=optional:file:.env[.properties]

# --- Datasource (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Tables come from db/schema.sql; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- SQL logging ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/api/v1/**
