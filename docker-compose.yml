# Local stack: the API built from ./Dockerfile + MySQL 8.
#
#   docker compose up -d --build     # first run: MySQL loads db/schema.sql, then the API starts
#   docker compose logs -f api
#   docker compose down              # keep data
#   docker compose down -v           # wipe data -> schema.sql re-runs on next up
#
# All secrets come from .env (git-ignored; see .env.example). Nothing sensitive lives in this file.

services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      # host 3307 -> container 3306, so a MySQL already on the host's 3306 is untouched
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once, on first initialisation of the data volume only.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # TCP ping on 127.0.0.1 deliberately: during init MySQL serves a temporary
      # socket-only instance, and we must not report healthy until the real one is up.
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:local
    container_name: ecommerce-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    # HEALTHCHECK is inherited from the Dockerfile (/actuator/health).
    restart: unless-stopped

volumes:
  mysql-data:
